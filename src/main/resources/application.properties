spring.application.name=worktime-tracker
server.port=${PORT:8080}
# The default database is an embedded *file* DB, not an in-memory DB.
# Launch from the repository root so ./data stays stable across restarts.
spring.datasource.url=${WORKTIME_DB_URL:jdbc:h2:file:./data/worktime;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${WORKTIME_DB_USER:sa}
spring.datasource.password=${WORKTIME_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false
spring.jackson.property-naming-strategy=SNAKE_CASE

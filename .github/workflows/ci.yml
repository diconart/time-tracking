name: Java build and tests
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-pwa.cjs
